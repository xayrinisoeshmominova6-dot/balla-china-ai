[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "balla"
version = "0.1.0"
description = "Balla China Language — AI Instagram menejeri"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.10.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pypinyin>=0.51",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
balla = "balla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
balla = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
